<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Celular 3D Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #1e293b;
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            height: calc(100vh - 70px);
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
        }
        #viewer-container {
            flex: 2;
            position: relative;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        .sidebar {
            flex: 1;
            background: #1e293b;
            padding: 2rem;
            overflow-y: auto;
            border-left: 2px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        @media (max-width: 768px) {
            .sidebar {
                border-left: none;
                border-top: 2px solid #334155;
                height: 50vh;
            }
        }
        .info-card h2 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .info-card .size {
            background: #0284c7;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            display: inline-block;
            font-size: 0.875rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .info-card p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
        .info-card h3 {
            font-size: 1.1rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            border-bottom: 1px solid #475569;
            padding-bottom: 0.25rem;
        }
        .info-card ul {
            list-style-type: disc;
            padding-left: 1.2rem;
            color: #cbd5e1;
        }
        .info-card li {
            margin-bottom: 0.3rem;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            gap: 1rem;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        #step-indicator {
            font-weight: bold;
            color: #94a3b8;
            text-align: center;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #38bdf8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Explorador Celular y Microbiano 3D</h1>
    </header>

    <div class="main-container">
        <div id="viewer-container">
            <div id="loading" class="loading">Cargando modelo 3D...</div>
            <canvas id="canvas3d"></canvas>
        </div>

        <div class="sidebar">
            <div class="info-card" id="info-card"></div>
            <div class="controls">
                <button id="prev-btn">&#9664; Anterior</button>
                <span id="step-indicator">1 / 6</span>
                <button id="next-btn">Siguiente &#9654;</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Nombres exactos de los archivos que tienes en la carpeta Web Biologia
        const stepsData = [
            {
                title: "Arqueas (Archaea)",
                size: "Medida típica: 0.1 µm – 15 µm",
                file: "archaea.glb",
                description: "Microorganismos procariotas unicelulares. Poseen membranas lipídicas únicas con enlaces éter que les permiten sobrevivir en ambientes de condiciones extremas.",
                parts: ["Membrana celular", "Pared celular de pseudopeptidoglicano", "Citoplasma", "Flagelos (arquelo)", "Ribosomas 70S"]
            },
            {
                title: "Célula Animal",
                size: "Medida típica: 10 µm – 30 µm",
                file: "animal_cell_-_downloadable.glb",
                description: "Célula eucariota característica de los tejidos animales. Carece de pared celular rígida, lo que le otorga gran flexibilidad y diversidad de formas.",
                parts: ["Núcleo", "Mitocondrias", "Retículo endoplasmático", "Aparato de Golgi", "Lisosomas"]
            },
            {
                title: "Célula Vegetal",
                size: "Medida típica: 10 µm – 100 µm",
                file: "plant_cell.glb",
                description: "Célula eucariota propia de plantas. Destaca por su pared celular de celulosa, gran vacuola central y cloroplastos para la fotosíntesis.",
                parts: ["Pared celular", "Cloroplastos", "Vacuola central", "Núcleo y mitocondrias", "Plasmodesmos"]
            },
            {
                title: "Célula Fúngica (Hongos)",
                size: "Medida típica: 2 µm – 10 µm",
                file: "fungal_cell.glb",
                description: "Célula eucariota típica de hongos, caracterizada por poseer una pared celular rígida compuesta principalmente de quitina.",
                parts: ["Pared celular de quitina", "Membrana plasmática", "Núcleo definido", "Mitocondrias", "Spitzenkörper"]
            },
            {
                title: "Neutrófilo",
                size: "Medida típica: 12 µm – 15 µm",
                file: "neutrophil-final.glb",
                description: "Glóbulo blanco fagocítico esencial del sistema inmunitario innato. Actúa como la primera línea de defensa contra infecciones bacterianas.",
                parts: ["Núcleo multilobulado", "Gránulos citoplasmáticos", "Membrana flexible", "Receptores de superficie"]
            },
            {
                title: "Glóbulos Rojos (Eritrocitos)",
                size: "Medida típica: 6 µm – 8 µm",
                file: "red_blood_cells_erythrocytes.glb",
                description: "Células sanguíneas especializadas en el transporte de oxígeno. Tienen forma de disco bicóncavo y carecen de núcleo en mamíferos.",
                parts: ["Hemoglobina", "Membrana plasmática", "Citoesqueleto", "Ausencia de núcleo"]
            }
        ];

        let currentIndex = 0;
        let scene, camera, renderer, currentModel, controls;

        function init3D() {
            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            window.addEventListener('resize', onWindowResize);
            loadStep(currentIndex);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) currentModel.rotation.y += 0.003;
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function loadStep(index) {
            const step = stepsData[index];
            document.getElementById('step-indicator').innerText = `${index + 1} / ${stepsData.length}`;
            
            document.getElementById('info-card').innerHTML = `
                <div>
                    <h2>${step.title}</h2>
                    <span class="size">${step.size}</span>
                    <p>${step.description}</p>
                    <h3>Partes Principales:</h3>
                    <ul>
                        ${step.parts.map(part => `<li>${part}</li>`).join('')}
                    </ul>
                </div>
            `;

            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            document.getElementById('loading').style.display = 'block';

            const loader = new THREE.GLTFLoader();
            loader.load(
                step.file,
                function (gltf) {
                    currentModel = gltf.scene;
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2 / maxDim;
                    currentModel.scale.set(scale, scale, scale);
                    currentModel.position.sub(center.multiplyScalar(scale));
                    
                    scene.add(currentModel);
                    document.getElementById('loading').style.display = 'none';
                },
                undefined,
                function (error) {
                    console.warn("Error cargando el modelo GLB local, usando respaldo:", error);
                    createFallbackGeometry();
                    document.getElementById('loading').style.display = 'none';
                }
            );
        }

        function createFallbackGeometry() {
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
            currentModel = new THREE.Mesh(geometry, material);
            scene.add(currentModel);
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % stepsData.length;
            loadStep(currentIndex);
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + stepsData.length) % stepsData.length;
            loadStep(currentIndex);
        });

        window.onload = init3D;
    </script>
</body>
</html>
